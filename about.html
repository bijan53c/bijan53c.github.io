<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0a0b0a;
    --panel: #101211;
    --panel-2: #0d0f0e;
    --border: #262a26;
    --border-dashed: #2c3130;
    --text: #e7e9e3;
    --muted: #8b9088;
    --accent: #4da3ff;
    --accent-dim: #2f6cb0;
    --purple: #a06bf0;
    --pink: #f0679b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
  }

  h1, h2, .display {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.01em;
    line-height: 1.1;
  }

  a { color: inherit; text-decoration: none; }
  .container { max-width: 1400px; margin: 0 auto; padding: 0 2rem; }

  /* ---------- NAV (same as main page) ---------- */
  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.25rem 2rem;
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 0.85rem; }
  .brand-icon {
    width: 2.6rem; height: 2.6rem;
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem;
    background: var(--panel);
  }
  .brand-name { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.15rem; letter-spacing: 0.02em; }
  .brand-tag { font-size: 0.68rem; color: var(--accent); letter-spacing: 0.05em; }

  .nav-links { display: flex; gap: 2.1rem; font-size: 0.8rem; letter-spacing: 0.06em; }
  .nav-links a { color: var(--muted); padding-bottom: 0.4rem; border-bottom: 2px solid transparent; }
  .nav-links a.active { color: var(--text); border-color: var(--accent); }
  .nav-links a:hover { color: var(--text); }

  .nav-right { display: flex; align-items: center; gap: 1rem; }
  .join-btn {
    border: 1px solid var(--accent-dim);
    color: var(--accent);
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    padding: 0.6rem 1.2rem;
  }
  .join-btn:hover { background: var(--accent); color: #0a0b0a; }
  .icon-btn {
    width: 2.4rem; height: 2.4rem;
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem; color: var(--muted);
  }
  @media (max-width: 980px) { .nav-links { display: none; } }

  /* ---------- ABOUT HERO ---------- */
  .about-hero {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3rem;
    padding: 3.5rem 2rem;
    align-items: center;
  }
  .eyebrow {
    color: var(--accent);
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    margin-bottom: 1.1rem;
  }
  .eyebrow::before { content: "_"; }
  .about-text h1 {
    font-size: clamp(1.9rem, 4vw, 2.9rem);
    margin-bottom: 0.2rem;
  }
  .about-text h1 .line-white { color: var(--text); display: block; }
  .about-text h1 .line-accent { color: var(--accent); display: block; }
  .about-text p.lede {
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.8;
    max-width: 480px;
    margin: 1.5rem 0 2rem;
    white-space: pre-line;
  }

  .detail-list { display: flex; flex-direction: column; gap: 0.9rem; }
  .detail-row { display: flex; gap: 0.6rem; font-size: 0.85rem; }
  .detail-row .chevron { color: var(--accent); }
  .detail-row .dkey { color: var(--accent); min-width: 150px; }
  .detail-row .dval { color: var(--text); }

  /* ---------- ABOUT IMAGE ---------- */
  .about-media {
    position: relative;
    aspect-ratio: 4 / 3.4;
    background: #10151c center/cover no-repeat;
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .about-media::before {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(0deg, rgba(10,11,10,0.5), rgba(10,11,10,0) 45%);
  }
  .corner {
    position: absolute;
    width: 18px; height: 18px;
    border: 2px solid var(--accent);
    z-index: 2;
  }
  .corner.tl { top: 0.9rem; left: 0.9rem; border-right: none; border-bottom: none; }
  .corner.br { bottom: 0.9rem; right: 0.9rem; border-left: none; border-top: none; }

  .
  .side-label {
    position: absolute;
    right: -1.4rem; top: 50%;
    transform: translateY(-50%) rotate(90deg);
    font-size: 0.68rem;
    letter-spacing: 0.2em;
    color: var(--accent-dim);
    z-index: 2;
    white-space: nowrap;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.6);
  }
  .corner-tag {
    position: absolute;
    bottom: 0.9rem; right: 3rem;
    font-size: 0.9rem;
    color: var(--accent-dim);
    z-index: 2;
    letter-spacing: 0.05em;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.6);
  }

  @media (max-width: 980px) {
    .about-hero { grid-template-columns: 1fr; padding: 2.5rem 1.5rem; }
    .about-media { order: -1; }
  }

  /* ---------- SKILLS + PHILOSOPHY ---------- */
  .panels {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 1px;
    background: var(--border);
    border-top: 1px solid var(--border);
  }
  .panel {
    background: var(--bg);
    padding: 2rem;
  }
  .panel-label {
    color: var(--accent);
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    margin-bottom: 1.5rem;
  }
  .panel-label::before { content: "// "; }

  .skills-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.75rem 2.5rem;
  }
  .skill-name {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 0.6rem;
  }
  .skill-bar-row { display: flex; align-items: center; gap: 0.75rem; }
  .skill-segments { display: flex; gap: 1.5px; flex: 1; }
  .skill-segments .seg { flex: 1; height: 8px; background: var(--panel-2); }
  .skill-segments .seg.filled { background: var(--accent); }
  .skill-pct { font-size: 0.85rem; color: var(--text); min-width: 2.6rem; text-align: right; }

  @media (max-width: 700px) {
    .panels { grid-template-columns: 1fr; }
    .skills-grid { grid-template-columns: 1fr; }
  }

  .philosophy-panel { position: relative; border-left: 1px solid var(--border); }
  .quote-mark { color: var(--accent-dim); font-size: 2.4rem; font-family: 'Space Grotesk', sans-serif; line-height: 1; }
  .quote-mark.open { margin-bottom: -0.5rem; }
  .quote-mark.close { text-align: right; margin-top: -0.5rem; }
  .quote-lines { color: var(--text); font-size: 0.9rem; line-height: 2; padding: 0 0.25rem; }
  .quote-lines .accent { color: var(--accent); }

  /* ---------- FOOTER (same as main page) ---------- */
  footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1.5rem;
    padding: 1.5rem 2rem;
    border-top: 1px solid var(--border);
  }
  .footer-left { display: flex; align-items: center; gap: 0.9rem; }
  .footer-skull {
    width: 2.4rem; height: 2.4rem;
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem;
  }
  .footer-left .line1 { font-size: 0.85rem; }
  .footer-left .line1 .cmd { color: var(--accent); }
  .footer-left .line2 { font-size: 0.85rem; color: var(--muted); }
  .footer-left .line2 span { color: var(--accent); }

  .footer-social { display: flex; gap: 1.25rem; }
  .footer-social a {
    width: 2.2rem; height: 2.2rem;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted);
    font-size: 1rem;
    border: 1px solid transparent;
  }
  .footer-social a:hover { color: var(--accent); border-color: var(--border); }

  .footer-right { text-align: right; font-size: 0.85rem; color: var(--muted); }
  .footer-right .cmd { color: var(--accent); }
  .footer-right .line2::after {
    content: "▌";
    color: var(--accent);
    margin-left: 0.3rem;
    animation: blink 1.1s steps(1) infinite;
  }

  @media (max-width: 700px) {
    footer { flex-direction: column; align-items: flex-start; }
    .footer-right { text-align: left; }
  }
</style>
</head>
<body>

<nav>
  <div class="brand">
    <div class="brand-icon">💀</div>
    <div>
      <div class="brand-name">www-data</div>
      <div class="brand-tag">// stay curious</div>
    </div>
  </div>
  <div class="nav-links">
    <a href="index.html">HOME</a>
    <a href="about.html" class="active">ABOUT</a>
    <a href="https://github.com/bijan53c/">TOOLS</a>
    <a href="https://github.com/bijan53c/">PROJECTS</a>
    <a href="BlogLanding.html">BLOG</a>
    <a href="https://linkedin.com/in/bijans3c">CONTACT</a>
  </div>
  <div class="nav-right">
    <a href="https://linkedin.com/in/bijans3c" class="join-btn">CONTACT</a>
    <div class="icon-btn">📲</div>
  </div>
</nav>

<section class="about-hero">
  <div class="about-text">
    <span class="eyebrow">ABOUT_ME</span>
    <h1>
      <span class="line-white" id="heading-line1">Bijan Agharafiei,</span>
      <span class="line-accent" id="heading-line2">.aka Bijan53c.</span>
    </h1>
    <p class="lede" id="about-paragraph"></p>
    <div class="detail-list" id="detail-list"><!-- rendered by JS from ABOUT_CONFIG.details --></div>
  </div>

  <div class="about-media" id="about-media" style="background-image:url('/Assets/Banners/JPG/gtaCollage.jpg');">
    <div class="corner tl"></div>
    <div class="corner br"></div>
    <div class="side-label" id="side-label">STAY CURIOUS</div>
    <div class="corner-tag" id="corner-tag">53C ///</div>

    <div class="terminal-overlay">
      <div class="t-head"><div class="t-dot"></div><span id="terminal-user">user@www-data:~</span></div>
      <div class="t-body" id="terminal-body"><!-- rendered by JS from ABOUT_CONFIG.terminalLines --></div>
    </div>
  </div>
</section>

<div class="panels">
  <div class="panel">
    <div class="panel-label">Skills</div>
    <div class="skills-grid" id="skills-grid"><!-- rendered by JS from SKILLS --></div>
  </div>

  <div class="panel philosophy-panel">
    <div class="panel-label">Philosophy</div>
    <div class="quote-mark open">&ldquo;</div>
    <div class="quote-lines" id="philosophy-lines"><!-- rendered by JS from PHILOSOPHY --></div>
    <div class="quote-mark close">&rdquo;</div>
  </div>
</div>

<footer>
  <div class="footer-left">
    <div class="footer-skull">💀</div>
    <div>
      <div class="line1"><span class="cmd">visitor&gt;</span> whoami</div>
      <div class="line2">still <span>debugging</span>.</div>
    </div>
  </div>

  <div class="footer-social">
    <a href="https://x.com/bijan5ec" target="_blank" rel="noopener" title="X">𝕏</a>
    <a href="https://github.com/bijan53c" target="_blank" rel="noopener" title="GitHub">🐙</a>
    <a href="https://gitlab.com/bijan53c" target="_blank" rel="noopener" title="GitLab">🦊</a>
    <a href="https://linkedin.com/linkedin.com/in/bijans3c" target="_blank" rel="noopener" title="LinkedIn">in</a>
  </div>

  <div class="footer-right">
    <div class="cmd">www-data@homepage:~#</div>
    <div class="line2">stay curious.</div>
  </div>
</footer>

<script>
  /* ======================================================================
     EDIT EVERYTHING BELOW — this is the only section you need to touch.
     ====================================================================== */

  const ABOUT_CONFIG = {
    headingLine1: "Bijan Agharafiei,",
    headingLine2: ".aka Bijan53c",

    // Use "\n" for a line break inside the paragraph
    paragraph: "I'm  a white hat hacker, developer, and problem solver.\nI enjoy breaking and building things to understand them,\nCybersecurity, Cryptography, and systems fascinate me — the challenge never ends.",

    details: [
      { key: "NAME",           value: "BIJAN53C" },
      { key: "FOCUS",          value: "WEB SECURITY / DEV / WEB 3.0" },
      { key: "EXPERIENCE",     value: "4+ YEARS OF FREELANCE DEV, 2+ SOC ANALYST T.3j" },
      { key: "LOCATION",       value: "SOMEWHERE ON THE INTERNET" },
      { key: "CURRENT STATUS", value: "BUILDING, BREAKING, LEARNING." }
    ],

    // Path or URL to your portrait/banner image for this page
    image: "/Assets/Banners/JPG/gtaCollage.jpg",

    // Small label rotated on the right edge of the image
    sideLabel: "",

    // Small tag near the bottom-right corner of the image
    cornerTag: "53C ///",

    // Terminal window overlaid on the image
    terminalUser: "",
    terminalLines: [
      
    ]
  };

  // Add/remove skills freely. percent: 0-100.
  const SKILLS = [
    { name: "PYTHON",              percent: 80 },
    { name: "LINUX",               percent: 55 },
    { name: "WINDOWS",               percent: 55 },
    { name: "WEB SECURITY",        percent: 50 },
    { name: "SOLIDITY",               percent: 20 }
    
  ];

  // Each string becomes its own line inside the quote block.
  // Wrap any word in **double asterisks** to highlight it in accent color.
  const PHILOSOPHY = [
    "The best way to predict the system,",
    "is to understand it.",
    "The best way to improve the system,",
    "is to break it."
  ];

  /* ======================================================================
     Rendering logic below — you shouldn't need to touch this.
     ====================================================================== */

  document.getElementById("heading-line1").textContent = ABOUT_CONFIG.headingLine1;
  document.getElementById("heading-line2").textContent = ABOUT_CONFIG.headingLine2;
  document.getElementById("about-paragraph").textContent = ABOUT_CONFIG.paragraph;
  document.getElementById("about-media").style.backgroundImage = `url('${ABOUT_CONFIG.image}')`;
  document.getElementById("side-label").textContent = ABOUT_CONFIG.sideLabel;
  document.getElementById("corner-tag").textContent = ABOUT_CONFIG.cornerTag;
  document.getElementById("terminal-user").textContent = ABOUT_CONFIG.terminalUser;

  const detailList = document.getElementById("detail-list");
  ABOUT_CONFIG.details.forEach(d => {
    const row = document.createElement("div");
    row.className = "detail-row";
    row.innerHTML = `<span class="chevron">&gt;</span><span class="dkey">${d.key}:</span><span class="dval">${d.value}</span>`;
    detailList.appendChild(row);
  });

  const termBody = document.getElementById("terminal-body");
  ABOUT_CONFIG.terminalLines.forEach((line, i) => {
    const row = document.createElement("div");
    const isLast = i === ABOUT_CONFIG.terminalLines.length - 1;
    row.innerHTML = `<span class="prompt">${line.prompt}</span> ${line.text}${isLast ? '<span class="cursor"></span>' : ""}`;
    termBody.appendChild(row);
  });

  function skillSegments(percent) {
    const total = 24;
    const filled = Math.round((percent / 100) * total);
    let html = "";
    for (let i = 0; i < total; i++) {
      html += `<div class="seg ${i < filled ? "filled" : ""}"></div>`;
    }
    return html;
  }

  const skillsGrid = document.getElementById("skills-grid");
  SKILLS.forEach(s => {
    const item = document.createElement("div");
    item.innerHTML = `
      <div class="skill-name">${s.name}</div>
      <div class="skill-bar-row">
        <div class="skill-segments">${skillSegments(s.percent)}</div>
        <div class="skill-pct">${s.percent}%</div>
      </div>
    `;
    skillsGrid.appendChild(item);
  });

  const philoEl = document.getElementById("philosophy-lines");
  PHILOSOPHY.forEach(line => {
    const p = document.createElement("div");
    p.innerHTML = line.replace(/\*\*(.+?)\*\*/g, '<span class="accent">$1</span>');
    philoEl.appendChild(p);
  });
</script>

</body>
</html>
